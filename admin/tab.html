<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8"/>
    <link rel="shortcut icon" href="favicon.ico" />
    <link rel="stylesheet" type="text/css" href="style.css" />
    <meta
        name="viewport"
        content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta name="theme-color" content="#000000" />
    <link rel="manifest" href="manifest.json" />
    <script>
        // Paint the theme background before React mounts, otherwise the page flashes white
        (function () {
            var themeName;
            try {
                themeName = window.localStorage.getItem('App.themeName');
            } catch (e) {
                // localStorage can be blocked in an iframe
            }
            if (!themeName || themeName === 'auto') {
                themeName = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'modernDark' : 'modernLight';
            }
            // must stay in sync with the palettes of @iobroker/gui-components
            var backgrounds = {
                modernDark: '#0A121D',
                modernLight: '#F4F7FB',
                dark: '#121212',
                blue: '#151d21',
                light: '#ffffff',
                colored: '#ffffff',
            };
            document.documentElement.style.backgroundColor = backgrounds[themeName] || '#ffffff';
        })();

        var script = document.createElement('script');
        window.registerSocketOnLoad = function (cb) {
            window.socketLoadedHandler = cb;
        };
        const parts = (window.location.search || '').replace(/^\?/, '').split('&');
        const query = {};
        parts.forEach(item => {
            const [name, val] = item.split('=');
            query[decodeURIComponent(name)] = val !== undefined ? decodeURIComponent(val) : true;
        });
        script.onload = function () { typeof window.socketLoadedHandler === 'function' && window.socketLoadedHandler(); };
        script.src = parseInt(window.location.port, 10) >= 3000 && parseInt(window.location.port, 10) <= 3100 ? `${window.location.protocol}//${query.host || window.location.hostname}:${query.port || 8081}/lib/js/socket.io.js` : '../../lib/js/socket.io.js';

        document.head.appendChild(script);
    </script>
    <title>Scenes [ioBroker]</title>

  <link rel="stylesheet" crossorigin href="./assets/index-CUC67mJV.css">
</head>
<body>

    <div id="root"></div>
</body>
</html>
